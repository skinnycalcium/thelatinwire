name: Publish edition

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run the desk
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LW_THEME: ${{ vars.LW_THEME || 'marino' }}
        run: npm run edition
      - name: Commit archive
        run: |
          git config user.name "latin-wire-bot"
          git config user.email "bot@thelatinwire.com"
          git add -A data public
          git diff --cached --quiet || git commit -m "Edition $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
